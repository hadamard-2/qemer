name: Create binary release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out the release commit
        uses: actions/checkout@v5

      - name: Read release metadata
        id: release
        run: |
          package_version="$(awk -F '"' '/^version = / { print $2; exit }' qemer-tui/Cargo.toml)"
          if [ -z "$package_version" ]; then
            echo "qemer-tui has no package version." >&2
            exit 1
          fi
          echo "tag=v${package_version}" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag or release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler

      - name: Install Rust 1.91
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Test the workspace
        run: cargo +1.91.0 test --workspace --locked

      - name: Build the Linux binary
        run: cargo +1.91.0 build --package qemer-tui --bin qemer --release --locked

      - name: Package the release assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          target="qemer-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${target}"
          cp target/release/qemer "dist/${target}/qemer"
          tar -C dist -czf "dist/${target}.tar.gz" "$target"
          (
            cd dist
            sha256sum "${target}.tar.gz" > "${target}.tar.gz.sha256"
          )

      - name: Create the draft release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/qemer-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/qemer-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"
