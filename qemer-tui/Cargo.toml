[package]
name = "qemer-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qemer"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6.5"
# Declared only to enable `event-stream`, which is not a default feature and
# which neither ratatui nor ratatui-crossterm forwards. Every `use` goes
# through `ratatui::crossterm` so the types stay identical to the ones
# ratatui builds against — the same rule docs/decisions.md sets for Arrow.
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream"] }
dialoguer = "0.12.0"
directories = "6"
futures = "0.3.34"
qemer-answer = { version = "0.1.0", path = "../qemer-answer" }
qemer-core = { version = "0.1.0", path = "../qemer-core" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9"

[dev-dependencies]
lancedb = "0.37.1"
parquet = { version = "58.4.0", features = ["arrow"] }
serde_json = "1.0.151"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
