[workspace]

[package]
name = "qemer-demo-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
clap = { version = "4.5", features = ["derive"] }
parquet = { version = "=58.4.0", features = ["arrow"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
zstd = "0.13"
